[package]
name = "averion-launcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "A native Minecraft Java Edition launcher"

[dependencies]
base64 = "0.23"
futures = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "image-without-codecs", "tokio", "x11", "wayland"] }
keyring-core = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std"] }
# Offline account UUIDs are version-3 (MD5) UUIDs per Mojang's offline convention.
# md-5 is the maintained RustCrypto MD5 implementation from the same family as
# the already approved sha1 and sha2 crates; hand-rolling MD5 would be worse.
md-5 = { version = "0.10", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "native-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "time"] }
zeroize = "1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
# OS version string for Mojang `os.name`/`os.version` argument rules (e.g.
# `^10\.`). Already present in the Windows dependency tree via winit.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
