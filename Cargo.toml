[package]
name = "averion-launcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "A native Minecraft Java Edition launcher"

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "image-without-codecs", "tokio", "x11", "wayland"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
tokio = { version = "1", features = ["io-util", "process", "time"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
